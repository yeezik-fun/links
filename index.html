<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Yeezik — DJ & Music Producer. Musica, video, eventi e social." />
  <title>Yeezik — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="fonts/Moderniz.woff" as="font" type="font/woff" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      background: #000;
      color: #f6f8ff;
      font-family: "Geist Mono", ui-monospace, monospace;
    }

    /* ===== SFONDO GradientASCII (CSS originale di React Bits) ===== */
    .gradient-ascii-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .gradient-ascii-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Lo sfondo resta fisso dietro a tutta la pagina */
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ===== SCHERMO INIZIALE (sopra lo sfondo) ===== */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh; /* altezza reale dello schermo su iPhone (senza barre del browser) */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* Titolo e sottotitolo centrati a circa il 65% dell'altezza dello schermo.
         Per spostarli: 30 = 65%, 40 = 70%, 50 = 75%. */
      padding: 30vh 16px 0;
      padding: 30svh 16px 0;
      pointer-events: none; /* il mouse "passa" allo sfondo… */
    }
    .hero a, .hero button { pointer-events: auto; } /* …tranne link e bottoni */

    /* ===== HELVETICA NOW =====
       È un font a pagamento (Monotype): metti il file .woff2 della tua licenza
       nella cartella "fonts" accanto a index.html. Finché il file manca,
       il browser usa Helvetica Neue / Helvetica / Arial. */
    @font-face {
      font-family: "Helvetica Now Display";
      src: url("fonts/HelveticaNowDisplay-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ===== MODERNIZ (Eko Bimantara, freeware) — font del titolo ===== */
    @font-face {
      font-family: "Moderniz";
      src: url("fonts/Moderniz.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ===== HELVETICA NOW TEXT (Monotype) — font del testo nelle schede ===== */
    @font-face {
      font-family: "Helvetica Now Text";
      src: url("fonts/HelveticaNowText-Bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    h1 {
      font-family: "Moderniz", "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      pointer-events: auto; /* serve per l'effetto al passaggio del mouse */
      cursor: default;
    }

    /* Classi di DecryptedText */
    .revealed { }
    .encrypted { }
    p.tagline {
      margin-top: 12px;
      /* stesso font e peso dei caratteri ASCII dello sfondo */
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 300;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      opacity: 0.75;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* =====================================================================
       PARTE BASSA — social, capitoli e sezioni (stile Komi)
       ===================================================================== */
    :root {
      --page: #0a0a0a;        /* sfondo della parte bassa (RGB 10,10,10) */
      --card: #161616;        /* sfondo delle card */
      --card-hover: #1f1f1f;
      --line: #262626;        /* linee di separazione */
      --text: #f6f8ff;
      --mute: rgba(246, 248, 255, 0.55);
      --accent: #38bdf8;      /* azzurro dello sfondo ASCII */
      --gutter: 16px;
      /* ALTEZZA UNICA di tutti i riquadri (card, quadrati, video):
         circa 150px su iPhone, tra 136 e 168px sugli altri schermi */
      --tile: clamp(136px, 39vw, 168px);
      /* Font del testo dentro le schede (card, video, merch) */
      --font-cards: "Helvetica Now Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* Testo delle schede in Helvetica Now Text Bold */
    .card .t, .card .s, .card .go,
    .video .vt, .video .frame.ph,
    .product .t, .product .s {
      font-family: var(--font-cards);
      font-weight: 700;
    }

    /* Blocco nome + sottotitolo: resta centrato al 65%, i social stanno sotto */
    .hero-id { position: relative; }

    /* ===== ICONE SOCIAL (sotto il nome) ===== */
    .socials {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 6px;
      width: max-content;
      max-width: calc(100vw - 2 * var(--gutter));
      flex-wrap: wrap;
    }
    .social {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      color: var(--text);
      border-radius: 50%;
      transition: background-color .2s ease, opacity .2s ease;
    }
    .social svg { width: 24px; height: 24px; fill: currentColor; display: block; }
    a.social:hover, a.social:focus-visible { background: rgba(246, 248, 255, 0.12); outline: none; }
    .social.off { opacity: 0.3; }

    /* Freccia "scorri" in fondo allo schermo iniziale */
    .scroll-cue {
      position: absolute;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--mute);
      text-decoration: none;
      pointer-events: auto;
      animation: cue 2.4s ease-in-out infinite;
    }
    @keyframes cue { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 5px); } }

    /* ===== CONTENUTO (copre lo sfondo ASCII quando scorri) ===== */
    .content {
      position: relative;
      z-index: 2;
      background: var(--page);
      padding-bottom: max(40px, env(safe-area-inset-bottom));
    }
    .content::before {           /* sfumatura dallo sfondo ASCII al nero */
      content: "";
      position: absolute;
      left: 0; right: 0;
      bottom: 100%;
      height: 120px;
      background: linear-gradient(to bottom, rgba(10,10,10,0), var(--page));
      pointer-events: none;
    }

    /* ===== BARRA DEI CAPITOLI (resta in alto mentre scorri) ===== */
    .chapters {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 12px var(--gutter);
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid transparent;
      transition: border-color .2s ease;
    }
    .chapters::-webkit-scrollbar { display: none; }
    .chapters.stuck { border-bottom-color: var(--line); }
    .chapter {
      flex: none;
      padding: 10px 14px;
      border-radius: 10px;
      color: var(--mute);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background-color .2s ease, color .2s ease;
    }
    .chapter:hover { color: var(--text); }
    .chapter.active { background: #222; color: var(--text); }

    /* ===== SEZIONI ===== */
    .section {
      padding: 32px var(--gutter);
      border-top: 1px solid var(--line);
      scroll-margin-top: 64px;
    }
    .section:first-of-type { border-top: 0; }
    .section h2 {
      font-family: "Moderniz", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      line-height: 1.1;
      margin-bottom: 18px;
    }
    .section .note { color: var(--mute); font-size: 0.75rem; margin: -8px 0 16px; letter-spacing: 0.04em; }

    /* --- Card con immagine a sinistra (Releases, Shows…) --- */
    .cards { display: flex; flex-direction: column; gap: 12px; }
    .card {
      display: flex;
      align-items: stretch;
      height: var(--tile);
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: background-color .2s ease, transform .2s ease;
    }
    a.card:hover, a.card:focus-visible { background: var(--card-hover); outline: none; }
    a.card:active { transform: scale(0.99); }
    .card .thumb { flex: none; width: var(--tile); height: var(--tile); }
    .card .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 14px 16px;
      text-align: left;
    }
    .card .t { font-size: 0.95rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card .s { font-size: 0.72rem; color: var(--mute); letter-spacing: 0.06em; text-transform: uppercase; }
    .card .go { align-self: center; padding-right: 16px; color: var(--mute); }
    .card.soon { opacity: 0.6; }

    /* Immagini: foto vera oppure segnaposto con le iniziali */
    .thumb { position: relative; background: #1c1c1c; overflow: hidden; }
    .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb.ph {
      display: grid;
      place-items: center;
      background:
        radial-gradient(120% 90% at 50% 120%, rgba(30, 63, 216, 0.55), transparent 60%),
        repeating-linear-gradient(0deg, rgba(246,248,255,0.04) 0 1px, transparent 1px 6px),
        #121212;
    }
    .thumb.ph span {
      font-family: "Moderniz", "Helvetica Neue", Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      opacity: 0.8;
    }

    /* --- Caroselli orizzontali (video, merch) --- */
    .rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      margin: 0 calc(-1 * var(--gutter));
      padding: 0 var(--gutter);
      scroll-padding: 0 var(--gutter);
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail > * { scroll-snap-align: start; flex: none; }

    /* Video YouTube */
    .video { width: calc(var(--tile) * 16 / 9); max-width: 100%; }
    .video .frame { height: var(--tile); aspect-ratio: auto !important; }
    .video .frame {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #121212;
    }
    .video .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video button.frame { display: block; width: 100%; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; }
    .video .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .video button.frame::after {   /* velo scuro sopra la copertina (solo prima di avviare il video) */
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0) 40%, rgba(0,0,0,0.35));
    }
    .video .play {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(10, 10, 10, 0.6);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
    }
    .video .play svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }
    .video .vt {
      position: absolute;
      left: 14px; right: 14px; top: 12px;
      z-index: 1;
      font-size: 0.8rem;
      text-align: left;
      line-height: 1.35;
    }
    /* Riga "Guarda su YouTube" sotto ogni video */
    .video .yt-link {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 0;
      font-family: var(--font-cards);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      text-decoration: none;
      transition: color .2s ease;
    }
    .video .yt-link:hover, .video .yt-link:focus-visible { color: var(--text); outline: none; }

    .video.only { width: calc(var(--tile) * 16 / 9); }
    .video .frame.ph { display: grid; place-items: center; color: var(--mute); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
    .video .frame.ph::after { display: none; }

    /* Prodotti / merch */
    .product { width: var(--tile); color: inherit; text-decoration: none; text-align: left; }
    .product .thumb { width: var(--tile); height: var(--tile); border-radius: 12px; }
    .product .t { margin-top: 10px; font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
    .product .s { margin-top: 4px; font-size: 0.72rem; color: var(--mute); letter-spacing: 0.06em; text-transform: uppercase; }

    /* --- Riquadro grande orizzontale (Pre-Save, Out Now) ---
       Artwork quadrato a sinistra, titolo + data + bottone a destra */
    .features { display: flex; flex-direction: column; gap: 12px; }
    .feature {
      display: grid;
      grid-template-columns: var(--tile) 1fr;
      grid-template-rows: 1fr auto;
      height: var(--tile);
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      text-align: left;
      transition: background-color .2s ease, transform .2s ease;
    }
    a.feature:hover, a.feature:focus-visible { background: var(--card-hover); outline: none; }
    a.feature:active { transform: scale(0.99); }
    .feature .thumb.art { grid-row: 1 / span 2; width: var(--tile); height: var(--tile); }
    .feature .thumb.art span { font-size: 1.1rem; }
    .feature .body { display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 12px 14px 0; min-width: 0; overflow: hidden; }
    .feature .t { font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .feature .s { font-size: 0.68rem; color: var(--mute); letter-spacing: 0.06em; text-transform: uppercase; }
    .feature .cta {
      display: flex; align-items: center; justify-content: center;
      margin: 10px 14px 14px;
      min-height: 40px;
      border-radius: 10px;
      background: var(--text);
      color: #000;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .feature .t, .feature .s, .feature .cta { font-family: var(--font-cards); font-weight: 700; }

    /* Etichetta "ESEMPIO" sui riquadri finti dell'anteprima */
    .thumb span.demo-tag, .thumb.ph span.demo-tag {
      position: absolute; top: 8px; left: 8px; z-index: 1;
      opacity: 1; line-height: 1;
      padding: 4px 7px; border-radius: 6px;
      background: var(--accent); color: #000;
      font-family: var(--font-cards); font-weight: 700;
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
    }

    /* Pulsante a destra nelle card (es. "Tickets") */
    .card .go { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }

    .foot {
      padding: 24px var(--gutter) 0;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mute);
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-cue { animation: none; }
      html { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  <!-- Sfondo animato -->
  <div id="bg"></div>

  <!-- Schermo iniziale: nome, sottotitolo, social -->
  <header class="hero">
    <div class="hero-id">
      <h1 id="title"></h1>
      <p class="tagline">DJ &amp; Music Producer</p>
      <nav class="socials" id="socials" aria-label="Social"></nav>
    </div>
    <a class="scroll-cue" href="#content">Scroll &darr;</a>
  </header>

  <!-- Parte bassa: barra dei capitoli + sezioni (si riempiono da CONTENUTI) -->
  <main class="content" id="content">
    <nav class="chapters" id="chapters" aria-label="Capitoli"></nav>
    <div id="sections"></div>
    <footer class="foot">&copy;2026 Yeezik</footer>
  </main>

  <script>
  /* =====================================================================
     GradientASCII — da React Bits, convertito in JavaScript puro
     Uso: createGradientASCII(elemento, { ...opzioni })
     ===================================================================== */
  (function () {
    const MAX_COLORS = 8;
    const MAX_CLICKS = 4;
    const MAX_TRAIL = 24;
    const CLICK_LIFE = 1.2;
    const TRAIL_LIFE = 0.7;
    const TRAIL_STEP = 0.015;
    const INTRO_SECONDS = 2.4;
    const ATLAS_CELL_W = 60;
    const ATLAS_CELL_H = 100;
    const ATLAS_COLUMNS = 16;
    const FONT_SCALE = 0.78;
    const DEFAULT_COLORS = ['#1e3fd8', '#f6f8ff', '#a5d8ff', '#38bdf8'];
    const DEFAULT_CHARACTERS = ' =+xX0S8#@';
    const DEFAULT_FONT = '"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    const SHAPES = { horizon: 0, pinch: 1, rise: 2, eclipse: 3 };
    const CLICK_EFFECTS = { none: 0, wave: 1, burst: 2 };

    const VERTEX = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

    const COMMON = `
float hash12(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
`;

    const FIELD = `#version 300 es
precision highp float;
precision highp int;
uniform float uAspect;
uniform float uTime;
uniform int uShape;
uniform vec3 uRamp[8];
uniform int uCount;
uniform float uScale;
uniform float uSoftness;
uniform float uFlow;
uniform vec2 uSeed;
uniform vec4 uTrail[24];
uniform float uRadius;
uniform vec4 uClicks[4];
uniform int uClickEffect;
uniform float uIntro;
uniform float uFrame;
in vec2 vUv;
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAux;
${COMMON}
vec2 hash22(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.103, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.xx + q.yz) * q.zy) * 2.0 - 1.0;
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = dot(hash22(i), f);
  float b = dot(hash22(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash22(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash22(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
  return 0.5 + 0.5 * mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

vec3 labToRgb(vec3 lab) {
  float l = lab.x + 0.3963377774 * lab.y + 0.2158037573 * lab.z;
  float m = lab.x - 0.1055613458 * lab.y - 0.0638541728 * lab.z;
  float s = lab.x - 0.0894841775 * lab.y - 1.2914855480 * lab.z;
  l = l * l * l;
  m = m * m * m;
  s = s * s * s;
  return vec3(
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
  );
}

vec3 encode(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

vec3 horizon(vec2 p, float time, out float order) {
  float span = 0.5 * max(uAspect, 1.0);
  float x = p.x / span;
  float arch = -0.17 - 0.2 * x * x + 0.02 * sin(time * 0.6);
  float soft = mix(0.05, 0.22, uSoftness);
  float edge = p.y - arch;
  float rim = 0.38 * smoothstep(-soft, 0.42, edge);
  vec2 sun = vec2(0.08 * sin(time * 0.31) * span, 0.58);
  float spread = length((p - sun) / vec2(0.95 * span, 0.75));
  float sky = mix(0.55, 1.0, smoothstep(0.2, 0.95, spread));
  order = clamp(edge * 1.3, 0.0, 1.0);
  return vec3(rim, sky, smoothstep(0.18, 0.62, edge));
}

vec3 pinch(vec2 p, float time, out float order) {
  float span = 0.5 * max(uAspect, 0.75);
  float x = p.x / span;
  float sway = 0.02 * sin(x * 1.7 + time * 0.55);
  float breathe = 1.0 + 0.06 * sin(time * 0.8);
  float width = (0.13 + 0.22 * x * x) * breathe * mix(0.85, 1.2, uSoftness);
  float y = abs(p.y - sway) / width;
  float t = exp(-pow(y, 2.2)) * (0.42 + 0.58 * exp(-x * x * 1.8));
  order = clamp(abs(p.y - sway) * 2.4 + abs(x) * 0.3, 0.0, 1.0);
  return vec3(t, t, 0.0);
}

  const h = (tag, cls, attrs = {}) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'text') el.textContent = v; else el.setAttribute(k, v);

    return el;

    s.setAttribute('viewBox', vb);
    s.setAttribute('aria-hidden', 'true');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);

    const body = h('div', 'body');
    body.append(h('span', 't', { text: it.title || '' }));
    if (sub) body.append(h('span', 's', { text: sub }));
    c.append(body);
    if (it.url) c.append(h('span', 'go', { text: it.button || '↗', 'aria-hidden': 'true' }));
    return c;
  };
  const squareEl = (it, sub) => {
    const p = linkOrBox(it.url, 'product');
    p.append(thumb(it.image));
    p.append(h('div', 't', { text: it.title || '' }));
    if (sub) p.append(h('div', 's', { text: sub }));
    return p;
  };

  // Riquadro grande: artwork quadrato, titolo, data, bottone bianco
  const demoTag = (el, it) => { if (it.demo) el.append(h('span', 'demo-tag', { text: 'Esempio' })); return el; };
  const featureEl = (it, sub, button) => {
    const f = linkOrBox(it.url, 'feature');
    f.append(demoTag(thumb(it.image, 'thumb art'), it));
    const body = h('div', 'body');
    body.append(h('span', 't', { text: it.title || '' }));
    if (sub) body.append(h('span', 's', { text: sub }));
    f.append(body);
    if (it.url) f.append(h('span', 'cta', { text: button + ' ↗' }));
    return f;
  };

  // Ogni tipo di capitolo: cosa mostra e quando è "vuoto"
  const BUILDERS = {
    feature(ch) {
      let items = ch.items || [];
      if (!items.length && PREVIEW) items = [{ title: 'Nome canzone', date: '', image: '', url: '#', button: 'Pre-save', demo: true, sub: 'Out · data di uscita' }];
      if (!items.length) return null;
      const list = h('div', 'features');
      items.forEach(it => list.append(featureEl(it, it.sub || (parseDate(it.date) > today ? 'Out ' : '') + fmtDate(it.date), it.button || 'Pre-save')));
      return list;
    },
    latest(ch) {
      // Ultima uscita già pubblicata (data di oggi o passata)
      let r = releasesSorted.find(x => { const d = parseDate(x.date); return d && d <= today; });
      if (!r && PREVIEW) r = { ...(releasesSorted[0] || { title: 'Nome canzone', kind: 'Single' }), url: '#', demo: true };
      if (!r) return null;
      const list = h('div', 'features');
      list.append(featureEl(r, releaseSub(r), r.button || ch.button || 'Listen'));
      return list;
    },
    releases() {
      if (!releasesSorted.length) return null;
      const rail = h('div', 'rail');
      releasesSorted.forEach(r => rail.append(squareEl(r, releaseSub(r))));
      return rail;
    },
    shows(ch) {
      let items = (ch.items || [])
        .filter(it => { const d = parseDate(it.date); return !d || d >= today; })
        .sort((a, b) => (parseDate(a.date) || 0) - (parseDate(b.date) || 0));
      if (!items.length && PREVIEW) items = [{ title: 'Nome evento / locale', city: 'Città', date: '', image: '', url: '#', demo: true, sub: 'Data · Città' }];
      if (!items.length) return null;
      const list = h('div', 'cards');
      items.forEach(it => {
        const sub = it.sub || [fmtDate(it.date), it.city].filter(Boolean).join(' · ');
        list.append(cardEl({ ...it, button: it.url ? (it.button || 'Tickets ↗') : '' }, sub));
      });
      return list;
    },
    videos(ch) {
      const frag = document.createDocumentFragment();
      if (ch.channel) {
        // Player con gli ultimi video del canale (playlist "uploads")
        const box = h('div', 'video only');
        const f = h('div', 'frame');
        f.append(h('iframe', '', {
          src: `https://www.youtube.com/embed/videoseries?list=UU${ch.channel.replace(/^UC/, '')}&playsinline=1&rel=0`,
          title: 'Ultimi video YouTube', loading: 'lazy',
          allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen',
          referrerpolicy: 'strict-origin-when-cross-origin', allowfullscreen: ''
        }));
        box.append(f);
        frag.append(box);
      }
      const vids = (ch.videos || []).filter(v => v.id || !ch.channel);
      if (vids.length) {
        const rail = h('div', 'rail');
        if (ch.channel) rail.style.marginTop = '12px';
        vids.forEach(v => rail.append(videoCard(v, vids.length === 1)));
        frag.append(rail);
      }
      return frag.childNodes.length ? frag : null;
    },
    products(ch) {
      const items = ch.items || [];
      if (!items.length) return null;
      const rail = h('div', 'rail');
      items.forEach(it => rail.append(squareEl(it, it.subtitle)));
      return rail;
    },
    cards(ch) {
      const items = ch.items || [];
      if (!items.length) return null;
      const list = h('div', 'cards');
      items.forEach(it => list.append(cardEl(it, it.subtitle)));
      return list;
    },
  };

  CHAPTERS.forEach(ch => {
    if (ch.show === false) return;                       // spento a mano
    const build = BUILDERS[ch.type] || BUILDERS.cards;
    const content = build(ch);
    if (!content) return;                                // vuoto → nascosto

    bar.append(h('a', 'chapter', { href: '#' + ch.id, text: ch.title }));
    const sec = h('section', 'section', { id: ch.id });
    sec.append(h('h2', '', { text: ch.title }));
    sec.append(content);
    wrap.append(sec);
  });
  if (!bar.children.length) bar.hidden = true;

  /* --- Barra dei capitoli: evidenzia quello che stai guardando --- */
  const chips = [...bar.querySelectorAll('.chapter')];
  const setActive = id => chips.forEach(c => {
    const on = c.getAttribute('href') === '#' + id;
    c.classList.toggle('active', on);
    if (on) bar.scrollTo({ left: c.offsetLeft - 16, behavior: 'smooth' });
  });
  // Attivo = l'ultimo capitolo il cui inizio è arrivato appena sotto la barra dei capitoli
  const secs = [...wrap.querySelectorAll('.section')];
  let current = null, ticking = false, picked = null;
  chips.forEach(c => c.addEventListener('click', () => { picked = c.getAttribute('href').slice(1); }));
  ['wheel', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => { picked = null; }, { passive: true }));
  const update = () => {
    ticking = false;
    let id = secs[0] && secs[0].id;
    const line = bar.getBoundingClientRect().bottom + 24;
    for (const s of secs) if (s.getBoundingClientRect().top <= line) id = s.id;
    // In fondo alla pagina: tiene il capitolo che hai toccato, altrimenti l'ultimo
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4 && secs.length) id = picked || secs[secs.length - 1].id;
    if (id !== current) { current = id; setActive(id); }
  };
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  addEventListener('resize', update);
  update();

  // Linea sotto la barra quando resta attaccata in alto
  const sentinel = h('div'); bar.before(sentinel);
  new IntersectionObserver(([e]) => bar.classList.toggle('stuck', !e.isIntersecting)).observe(sentinel);

  // Lo sfondo animato si ferma quando lo schermo iniziale non si vede più
  // (la parte bassa lo copre): la pagina e i video restano fluidi.
  const bgEl = document.getElementById('bg');
  new IntersectionObserver(([e]) => { bgEl.style.display = e.isIntersecting ? '' : 'none'; })
    .observe(document.querySelector('.hero'));

  // Scorrimento morbido verso i capitoli
  document.documentElement.style.scrollBehavior = 'smooth';
  </script>
</body>
</html>
